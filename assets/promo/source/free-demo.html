<!doctype html><html lang="en-GB"><head><meta charset="utf-8"><title>Maz Works promo</title><style>
:root{--paper:#f6f6f3;--surface:#fff;--ink:#151615;--muted:#3f413b;--signal:#ff6b1a;--lilac:#e6dff8;--sky:#d7ebf7;--mint:#d6f0e3;--pink:#fadce7;--sun:#fbeab2;
--mono:"Cascadia Mono","SFMono-Regular",Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;--sans:"Aptos","Segoe UI Variable","Liberation Sans",Arial,system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1080px;background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden}
.s{width:1080px;height:1080px;padding:64px 72px;display:flex;flex-direction:column;position:relative}
.top{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:16px}
.mark{width:56px;height:56px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:22px;letter-spacing:-.06em}
.n{border:3px solid var(--ink);background:var(--surface);padding:6px 16px;box-shadow:5px 5px 0 var(--ink)}
.eyebrow{font-family:var(--mono);font-weight:800;font-size:30px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tag{display:inline-block;border-bottom:6px solid var(--signal);padding-bottom:4px;margin-bottom:28px}
h1{font-size:104px;line-height:1.02;letter-spacing:-.025em;font-weight:900}
h2{font-size:76px;line-height:1.05;letter-spacing:-.02em;font-weight:900}
p.lead{font-size:46px;line-height:1.25;font-weight:600;margin-top:36px}
.body{flex:1;display:flex;flex-direction:column;justify-content:center}
.card{border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:36px 40px;background:var(--surface)}
.card .eyebrow{margin-bottom:14px;color:var(--ink)}
.card p{font-size:50px;line-height:1.18;font-weight:800}
.lilac{background:var(--lilac)}.sky{background:var(--sky)}.mint{background:var(--mint)}.pink{background:var(--pink)}.sun{background:var(--sun)}
.stack{display:flex;flex-direction:column;gap:44px}
.arrow{font-size:60px;font-weight:900;text-align:center;line-height:.6;margin:-14px 0}
.step{display:flex;gap:32px;align-items:center;border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:30px 36px;background:var(--surface)}
.step b.num{flex:none;width:92px;height:92px;border-radius:50%;background:var(--signal);border:4px solid var(--ink);display:grid;place-items:center;font-size:56px;font-weight:900}
.step span{font-size:46px;line-height:1.15;font-weight:800}
.price{font-size:190px;font-weight:900;letter-spacing:-.04em;line-height:1}
.list{list-style:none;padding:0;margin-top:28px;display:flex;flex-direction:column;gap:18px}
.list li{font-size:42px;line-height:1.2;font-weight:700;padding-left:60px;position:relative}
.list li:before{content:"";position:absolute;left:0;top:4px;width:36px;height:36px;border:4px solid var(--ink);background:var(--mint)}
.foot{font-family:var(--mono);font-weight:800;font-size:28px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:20px}
.btn{display:inline-block;background:var(--signal);border:4px solid var(--ink);box-shadow:10px 10px 0 var(--ink);padding:34px 48px;font-size:76px;font-weight:900;letter-spacing:-.01em}
.url{font-family:var(--mono);font-weight:800;font-size:38px;margin-top:48px;word-break:break-all;line-height:1.3}
</style></head><body><div class="s" style="padding:52px 64px"><div class="top"><div class="brand"><div class="mark">MW</div><span>Maz Works</span></div></div><div class="body" style="justify-content:center"><div class="eyebrow tag" style="width:fit-content;margin-bottom:22px">Free working demo</div><h1 style="font-size:80px">Free working demo with your business name, within 1 working day.</h1><div class="stack" style="gap:20px;margin-top:30px"><div class="step sky" style="padding:20px 30px;gap:26px;box-shadow:7px 7px 0 var(--ink)"><b class="num">1</b><span style="font-size:40px">What you get: a demo link to try on your phone.</span></div><div class="step lilac" style="padding:20px 30px;gap:26px;box-shadow:7px 7px 0 var(--ink)"><b class="num">2</b><span style="font-size:40px">It’s an example on my test setup until you say yes.</span></div><div class="step mint" style="padding:20px 30px;gap:26px;box-shadow:7px 7px 0 var(--ink)"><b class="num">3</b><span style="font-size:40px">Fixed price before any work.</span></div></div></div><div class="foot" style="font-size:26px"><span>mazworks.uk/free-plan?src=li-demo-offer</span></div></div></body></html>
