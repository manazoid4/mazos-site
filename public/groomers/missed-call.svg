<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t"><title id="t">A missed grooming call followed by a text with a booking link</title><rect width="480" height="320" rx="24" fill="#f5f6f3"/><circle cx="34" cy="72" r="9" fill="#c7ea6e"/><text x="34" y="76" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#13293a" text-anchor="middle">✓</text><text x="52" y="76" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#13293a" text-anchor="start">You’re mid-groom</text><circle cx="34" cy="124" r="9" fill="#c7ea6e"/><text x="34" y="128" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#13293a" text-anchor="middle">✓</text><text x="52" y="128" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#13293a" text-anchor="start">The caller gets a text</text><circle cx="34" cy="176" r="9" fill="#c7ea6e"/><text x="34" y="180" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#13293a" text-anchor="middle">✓</text><text x="52" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#13293a" text-anchor="start">They book instead of</text><text x="52" y="196" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#13293a" text-anchor="start">ringing round</text><rect x="250" y="22" width="206" height="276" rx="26" fill="#ffffff" stroke="#e1e6e8" stroke-width="1.5"/><rect x="331" y="30" width="44" height="5" rx="2.5" fill="#e1e6e8"/><circle cx="276" cy="74" r="11" fill="#ffe1d6"/><text x="276" y="78" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#13293a" text-anchor="middle">×</text><text x="294" y="73" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#13293a" text-anchor="start">Missed call</text><text x="294" y="88" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#56666f" text-anchor="start">New caller · 2:14pm</text><rect x="276" y="104" width="168" height="59" rx="12" fill="#13405a"/><text x="287" y="123" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">Sorry we missed you, we’re</text><text x="287" y="138" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">with a dog! Book here:</text><text x="287" y="153" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">yourbusiness.co.uk/book</text><text x="444" y="177" font-family="system-ui,sans-serif" font-size="10" font-weight="400" fill="#56666f" text-anchor="end">Sent automatically</text><text x="24" y="36" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#13405a" text-anchor="start">Missed call, texted back</text><text x="460" y="306" font-family="ui-monospace,monospace" font-size="10" fill="#56666f" text-anchor="end">ILLUSTRATIVE ONLY</text></svg>