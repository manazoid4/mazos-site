<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t"><title id="t">An unanswered garage quote receives a friendly nudge after three days</title><rect width="480" height="320" rx="24" fill="#f5f6f3"/><circle cx="34" cy="72" r="9" fill="#c7ea6e"/><text x="34" y="76" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#13293a" text-anchor="middle">✓</text><text x="52" y="76" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#13293a" text-anchor="start">Quote sent Monday</text><circle cx="34" cy="124" r="9" fill="#c7ea6e"/><text x="34" y="128" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#13293a" text-anchor="middle">✓</text><text x="52" y="128" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#13293a" text-anchor="start">No reply by Thursday</text><circle cx="34" cy="176" r="9" fill="#c7ea6e"/><text x="34" y="180" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#13293a" text-anchor="middle">✓</text><text x="52" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#13293a" text-anchor="start">A friendly nudge goes</text><text x="52" y="196" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#13293a" text-anchor="start">out</text><rect x="250" y="22" width="206" height="276" rx="26" fill="#ffffff" stroke="#e1e6e8" stroke-width="1.5"/><rect x="331" y="30" width="44" height="5" rx="2.5" fill="#e1e6e8"/><rect x="276" y="64" width="168" height="59" rx="12" fill="#13405a"/><text x="287" y="83" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">Hi Dan, just checking you</text><text x="287" y="98" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">got our quote for the</text><text x="287" y="113" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">brakes. Any questions?</text><text x="444" y="137" font-family="system-ui,sans-serif" font-size="10" font-weight="400" fill="#56666f" text-anchor="end">Thursday, sent automatically</text><rect x="262" y="145" width="168" height="44" rx="12" fill="#f5f6f3"/><text x="273" y="164" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#13293a" text-anchor="start">Yes, go ahead. Can you do</text><text x="273" y="179" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#13293a" text-anchor="start">Monday?</text><text x="24" y="36" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#13405a" text-anchor="start">Quote follow-up</text><text x="460" y="306" font-family="ui-monospace,monospace" font-size="10" fill="#56666f" text-anchor="end">ILLUSTRATIVE ONLY</text></svg>