<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="t"><title id="t">An intake form link sent before the first appointment</title><rect width="480" height="320" rx="24" fill="#f5f6f3"/><circle cx="34" cy="72" r="9" fill="#c7ea6e"/><text x="34" y="76" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#13293a" text-anchor="middle">✓</text><text x="52" y="76" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#13293a" text-anchor="start">Sent after booking</text><circle cx="34" cy="124" r="9" fill="#c7ea6e"/><text x="34" y="128" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#13293a" text-anchor="middle">✓</text><text x="52" y="128" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#13293a" text-anchor="start">Filled in at home</text><circle cx="34" cy="176" r="9" fill="#c7ea6e"/><text x="34" y="180" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#13293a" text-anchor="middle">✓</text><text x="52" y="180" font-family="system-ui,sans-serif" font-size="13" font-weight="400" fill="#13293a" text-anchor="start">Ready before they arrive</text><rect x="250" y="22" width="206" height="276" rx="26" fill="#ffffff" stroke="#e1e6e8" stroke-width="1.5"/><rect x="331" y="30" width="44" height="5" rx="2.5" fill="#e1e6e8"/><rect x="276" y="64" width="168" height="74" rx="12" fill="#13405a"/><text x="287" y="83" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">Hi Tom, before your first</text><text x="287" y="98" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">visit on Friday, please</text><text x="287" y="113" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">fill in this short form:</text><text x="287" y="128" font-family="system-ui,sans-serif" font-size="11.5" font-weight="400" fill="#ffffff" text-anchor="start">yourbusiness.co.uk/form</text><text x="444" y="152" font-family="system-ui,sans-serif" font-size="10" font-weight="400" fill="#56666f" text-anchor="end">Sent automatically</text><circle cx="276" cy="170" r="11" fill="#ebf5dc"/><text x="276" y="174" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#13293a" text-anchor="middle">✓</text><text x="294" y="169" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#13293a" text-anchor="start">Form completed</text><text x="294" y="184" font-family="system-ui,sans-serif" font-size="11" font-weight="400" fill="#56666f" text-anchor="start">2 days before the visit</text><text x="24" y="36" font-family="system-ui,sans-serif" font-size="14" font-weight="700" fill="#13405a" text-anchor="start">Intake form, sent ahead</text><text x="460" y="306" font-family="ui-monospace,monospace" font-size="10" fill="#56666f" text-anchor="end">ILLUSTRATIVE ONLY</text></svg>